[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "vcf_compare"
dynamic = ["version"]
description = "Tool for comparing VCFs"
readme = "README.md"
authors = [
    {name = "Tom Drever", email = "tomdr1001@outlook.com"},
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.1",
    "cyvcf2>=0.14.2",
    "matplotlib>=3.10.8",
    "simple-venn>=0.2.1"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.6",
]

[tool.setuptools.dynamic]
version = {attr = "vcf_compare.__version__"}

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]

[project.scripts]
venn-compare="vcf_compare.cli:venn_compare"
